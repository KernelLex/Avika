org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 defaults to built-in Kotlin compilation, which drops support for the
# explicit org.jetbrains.kotlin.android plugin this project still uses. Opt
# out to keep the existing plugin-based setup; KGP is still resolved at the
# AGP-required 2.2.10, so this isn't a version downgrade, just a DSL choice.
android.builtInKotlin=false
